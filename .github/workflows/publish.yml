name: Publish

on:
  # Tag-Trigger bewusst deaktiviert, solange kein NPM_TOKEN/Trusted
  # Publisher konfiguriert ist — sonst schlaegt der Lauf bei jedem
  # Release-Tag sichtbar fehl. Reaktivieren, sobald Trusted Publishing
  # auf npmjs.com eingerichtet ist.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: npm publish (provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
